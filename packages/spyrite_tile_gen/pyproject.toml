[project]
name = "spyrite-tile-gen"
version = "0.6.0"
description = "MCP server that generates pixel-art tiles, sprites and tilesets for Spyrite Tile."
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.10,<2",
    "httpx>=0.27",
    "pillow>=10",
    "pyyaml>=6",
]

[project.scripts]
spyrite-tile-gen = "spyrite_tile_gen.server:main"
spyrite-tile-dev = "spyrite_tile_gen.devserver:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spyrite_tile_gen"]
