[project]
name = "spyrite-tile-ops"
version = "0.6.0"
description = "blended op plugin: build Spyrite Tile scenes from an agent. Runs inside Blender."
requires-python = ">=3.11"
# No dependencies, on purpose: a dependency would be installed into blended's
# .venv, whose site-packages Blender puts first on sys.path.
dependencies = []

[project.entry-points."blended.ops"]
spyrite_tile = "spyrite_tile_ops.ops"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spyrite_tile_ops"]
