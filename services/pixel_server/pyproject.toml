[project]
name = "spyrite-pixel-server"
version = "0.6.0"
description = "Local SDXL pixel-art image service for Spyrite Tile (runs on the GPU host)."
requires-python = "==3.11.*"
# Pins match ~/mvadapter/.venv on the GPU host, the known-good torch/diffusers set.
dependencies = [
    "torch==2.13.0",
    "diffusers==0.39.0",
    "transformers==5.14.1",
    "peft==0.20.0",
    "accelerate",
    "safetensors",
    "fastapi",
    "uvicorn[standard]",
    "pillow",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_server"]
